name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
      previous_sha: ${{ steps.capture.outputs.previous_sha }}
      current_sha: ${{ steps.capture.outputs.current_sha }}
      short_sha: ${{ steps.capture.outputs.short_sha }}
      package_version: ${{ steps.capture.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        id: test
        continue-on-error: true
        run: npm test

      - name: Capture deployment information
        id: capture
        run: |
          set -euo pipefail
          CURRENT_SHA="${GITHUB_SHA}"
          SHORT_SHA="${CURRENT_SHA:0:7}"
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREVIOUS_SHA=$(git rev-parse HEAD~1)
          else
            PREVIOUS_SHA="${CURRENT_SHA}"
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          {
            echo "previous_sha=${PREVIOUS_SHA}"
            echo "current_sha=${CURRENT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "package_version=${PACKAGE_VERSION}"
          } >> "${GITHUB_OUTPUT}"
          echo "Captured deployment info:"
          echo "  Previous SHA:    ${PREVIOUS_SHA}"
          echo "  Current SHA:     ${CURRENT_SHA}"
          echo "  Short SHA:       ${SHORT_SHA}"
          echo "  Package Version: ${PACKAGE_VERSION}"

      - name: Ensure deployment labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'deployment', color: '0E8A16', description: 'Deployment tracking' },
              { name: 'in-progress', color: 'FBCA04', description: 'Deployment in progress' },
              { name: 'completed', color: '0075CA', description: 'Deployment completed' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                core.info(`Created label: ${label.name}`);
              } catch (error) {
                if (error.status === 422) {
                  core.info(`Label '${label.name}' already exists`);
                } else {
                  throw error;
                }
              }
            }

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        env:
          CURRENT_SHA: ${{ steps.capture.outputs.current_sha }}
          SHORT_SHA: ${{ steps.capture.outputs.short_sha }}
          PREVIOUS_SHA: ${{ steps.capture.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ steps.capture.outputs.package_version }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const currentSha = process.env.CURRENT_SHA;
            const shortSha = process.env.SHORT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const lintOutcome = process.env.LINT_OUTCOME;
            const testOutcome = process.env.TEST_OUTCOME;

            const body = [
              '## 🚀 Deployment Tracking',
              '',
              `Tracking deployment for commit \`${shortSha}\`.`,
              '',
              '### Deployment Information',
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Current Commit:** \`${currentSha}\``,
              `- **Package Version:** \`${packageVersion}\``,
              `- **Branch:** ${context.ref}`,
              `- **Triggered By:** @${context.actor}`,
              `- **Workflow Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Quality Checks',
              `- **Lint:** ${lintOutcome}`,
              `- **Tests:** ${testOutcome}`,
              '',
              '### Pipeline Stages',
              '- [x] pre-deployment',
              '- [ ] rollback-preparation',
              '- [ ] post-deployment',
              '',
              'This issue tracks the deployment lifecycle and will be updated automatically by the workflow.'
            ].join('
');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${currentSha}`,
              body: body,
              labels: ['deployment', 'in-progress']
            });
            core.setOutput('issue_number', issue.data.number);
            core.info(`Created tracking issue #${issue.data.number}`);

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          CURRENT_SHA: ${{ steps.capture.outputs.current_sha }}
          PREVIOUS_SHA: ${{ steps.capture.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ steps.capture.outputs.package_version }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const currentSha = process.env.CURRENT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const lintOutcome = process.env.LINT_OUTCOME;
            const testOutcome = process.env.TEST_OUTCOME;

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All initial quality checks have been executed and the deployment metadata has been captured.',
              '',
              '### Quality Check Results',
              `- **Lint:** ${lintOutcome}`,
              `- **Tests:** ${testOutcome}`,
              '',
              '### Deployment Metadata',
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Current Commit:** \`${currentSha}\``,
              `- **Package Version:** \`${packageVersion}\``,
              '',
              'Proceeding to the rollback preparation phase.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
            core.info(`Posted pre-deployment comment on issue #${issueNumber}`);

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Prepare rollback workspace
        run: |
          set -euo pipefail
          mkdir -p rollback-artifacts
          echo "Rollback workspace prepared at $(pwd)/rollback-artifacts"

      - name: Generate executable rollback script
        id: rollback-script
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        run: |
          set -euo pipefail
          cat > rollback-artifacts/rollback.sh <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # Automated rollback script generated by Deployment Status workflow.
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          INFO_FILE="${SCRIPT_DIR}/deployment-info.json"

          log() { printf '[rollback] %s
' "$*"; }
          fail() { printf '[rollback][error] %s
' "$*" >&2; exit 1; }

          trap 'fail "Rollback failed at line ${LINENO}"' ERR

          command -v git >/dev/null 2>&1 || fail "git is required to perform a rollback"

          if [ ! -f "${INFO_FILE}" ]; then
            fail "Missing deployment-info.json next to rollback script"
          fi

          PREVIOUS_SHA=$(node -p "require('${INFO_FILE}').previous_sha" 2>/dev/null || \
            grep -oE '"previous_sha"[[:space:]]*:[[:space:]]*"[^"]+"' "${INFO_FILE}" | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')
          CURRENT_SHA=$(node -p "require('${INFO_FILE}').current_sha" 2>/dev/null || \
            grep -oE '"current_sha"[[:space:]]*:[[:space:]]*"[^"]+"' "${INFO_FILE}" | head -n1 | sed -E 's/.*"([^"]+)"$/\1/')

          [ -n "${PREVIOUS_SHA:-}" ] || fail "Previous SHA not found in deployment metadata"
          [ -n "${CURRENT_SHA:-}" ] || fail "Current SHA not found in deployment metadata"

          if [ "${PREVIOUS_SHA}" = "${CURRENT_SHA}" ]; then
            fail "Previous SHA equals current SHA; nothing to roll back"
          fi

          log "Rolling back from ${CURRENT_SHA} to ${PREVIOUS_SHA}"

          git fetch --all --prune
          git checkout "${PREVIOUS_SHA}"

          if [ -f "${SCRIPT_DIR}/package.json.backup" ]; then
            cp "${SCRIPT_DIR}/package.json.backup" package.json
            log "Restored package.json from backup"
          fi
          if [ -f "${SCRIPT_DIR}/package-lock.json.backup" ]; then
            cp "${SCRIPT_DIR}/package-lock.json.backup" package-lock.json
            log "Restored package-lock.json from backup"
          fi

          if command -v npm >/dev/null 2>&1; then
            npm ci --omit=dev || npm install --omit=dev
            log "Reinstalled production dependencies"
          else
            log "npm not available; skipping dependency installation"
          fi

          log "Rollback completed successfully"
          ROLLBACK_EOF

          chmod +x rollback-artifacts/rollback.sh

          if [ -x rollback-artifacts/rollback.sh ] && bash -n rollback-artifacts/rollback.sh; then
            echo "script_created=true" >> "${GITHUB_OUTPUT}"
            echo "✅ Rollback script created and validated"
          else
            echo "script_created=false" >> "${GITHUB_OUTPUT}"
            echo "❌ Rollback script validation failed" >&2
            exit 1
          fi

      - name: Backup configuration files
        id: backup-config
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          GH_REF: ${{ github.ref }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cp package.json rollback-artifacts/package.json.backup
          cp package-lock.json rollback-artifacts/package-lock.json.backup

          cat > rollback-artifacts/.env.template <<'ENV_EOF'
          # Environment template captured at deployment time.
          # Copy this file to `.env` (or your deployment secrets store) before
          # invoking the rollback script and fill in the values that apply.
          NODE_ENV=production
          PORT=3000
          # Add additional environment variables required by the application below
          # API_KEY=
          # DATABASE_URL=
          ENV_EOF

          CAPTURED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > rollback-artifacts/deployment-info.json <<INFO_EOF
          {
            "repository": "${GH_REPOSITORY}",
            "ref": "${GH_REF}",
            "actor": "${GH_ACTOR}",
            "previous_sha": "${PREVIOUS_SHA}",
            "current_sha": "${CURRENT_SHA}",
            "package_version": "${PACKAGE_VERSION}",
            "run_id": "${GH_RUN_ID}",
            "captured_at": "${CAPTURED_AT}"
          }
          INFO_EOF

          if [ -f rollback-artifacts/package.json.backup ] \
             && [ -f rollback-artifacts/package-lock.json.backup ] \
             && [ -f rollback-artifacts/.env.template ] \
             && [ -f rollback-artifacts/deployment-info.json ]; then
            echo "backup_created=true" >> "${GITHUB_OUTPUT}"
            echo "✅ Configuration backups completed"
          else
            echo "backup_created=false" >> "${GITHUB_OUTPUT}"
            echo "❌ Configuration backups missing" >&2
            exit 1
          fi

      - name: Generate dependency verification script
        run: |
          set -euo pipefail
          cat > rollback-artifacts/verify-deps.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Verifies that the captured dependency manifests are compatible with the
          # current Node.js runtime before invoking the rollback script.
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PKG="${SCRIPT_DIR}/package.json.backup"
          LOCK="${SCRIPT_DIR}/package-lock.json.backup"

          log() { printf '[verify-deps] %s
' "$*"; }
          fail() { printf '[verify-deps][error] %s
' "$*" >&2; exit 1; }

          [ -f "${PKG}" ] || fail "Missing package.json backup"
          [ -f "${LOCK}" ] || fail "Missing package-lock.json backup"

          command -v node >/dev/null 2>&1 || fail "node runtime is required"

          ENGINE_NODE=$(node -p "(require('${PKG}').engines || {}).node || '*'")
          CURRENT_NODE=$(node -v)
          DEP_COUNT=$(node -p "Object.keys(require('${PKG}').dependencies || {}).length")
          DEV_COUNT=$(node -p "Object.keys(require('${PKG}').devDependencies || {}).length")

          log "Engine requirement: ${ENGINE_NODE}"
          log "Current node:       ${CURRENT_NODE}"
          log "Dependencies:       ${DEP_COUNT}"
          log "DevDependencies:    ${DEV_COUNT}"

          if [ "${ENGINE_NODE}" != "*" ]; then
            log "Validate ${CURRENT_NODE} against ${ENGINE_NODE} before proceeding"
          fi

          log "Dependency verification complete"
          VERIFY_EOF
          chmod +x rollback-artifacts/verify-deps.sh
          bash -n rollback-artifacts/verify-deps.sh
          echo "✅ Dependency verification script generated"

      - name: Generate rollback documentation
        env:
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="rollback-package-${CURRENT_SHA}"
          cat > rollback-artifacts/ROLLBACK.md <<DOC_EOF
          # Rollback Documentation

          This package contains everything required to roll back the deployment of
          commit \`${CURRENT_SHA}\` for **${GITHUB_REPOSITORY}**.

          ## Package Contents

          | File | Description |
          |------|-------------|
          | \`rollback.sh\` | Executable rollback script with error handling |
          | \`verify-deps.sh\` | Dependency compatibility verification helper |
          | \`package.json.backup\` | Pre-deployment package manifest |
          | \`package-lock.json.backup\` | Pre-deployment lockfile |
          | \`.env.template\` | Environment variable template |
          | \`deployment-info.json\` | Metadata about this deployment |

          ## Deployment Snapshot

          - Previous Commit: \`${PREVIOUS_SHA}\`
          - Current Commit: \`${CURRENT_SHA}\` (\`${SHORT_SHA}\`)
          - Package Version: \`${PACKAGE_VERSION}\`
          - Artifact: \`${ARTIFACT_NAME}\`

          ## Step-by-Step Rollback Instructions

          1. **Download the artifact** from the workflow run page or via:

             \`\`\`bash
             gh run download ${GITHUB_RUN_ID} --name ${ARTIFACT_NAME}
             \`\`\`

          2. **Extract the archive**:

             \`\`\`bash
             tar -xzf ${ARTIFACT_NAME}.tar.gz
             cd rollback-artifacts
             \`\`\`

          3. **Verify the checksum** of the archive against the published SHA256 digest:

             \`\`\`bash
             sha256sum -c ../${ARTIFACT_NAME}.sha256
             \`\`\`

          4. **Validate dependencies** are compatible with the current runtime:

             \`\`\`bash
             ./verify-deps.sh
             \`\`\`

          5. **Run the rollback script** to revert to the previous commit:

             \`\`\`bash
             ./rollback.sh
             \`\`\`

          6. **Confirm health** of the rolled-back deployment using the \`/health\`
             endpoint and any application-specific smoke tests.

          ## Recovery Notes

          - All scripts are idempotent and use \`set -euo pipefail\` for safe error
            propagation.
          - Backup files preserve dependency state; reapply them only when reverting.
          - If the rollback fails, capture stdout/stderr and re-run with \`bash -x\`
            for verbose tracing.
          DOC_EOF
          echo "✅ Rollback documentation generated"

      - name: Compress rollback package and compute checksum
        id: compress
        env:
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="rollback-package-${CURRENT_SHA}"
          tar -czf "${ARTIFACT_NAME}.tar.gz" rollback-artifacts/
          CHECKSUM=$(sha256sum "${ARTIFACT_NAME}.tar.gz" | awk '{print $1}')
          echo "${CHECKSUM}  ${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.sha256"
          {
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "checksum=${CHECKSUM}"
          } >> "${GITHUB_OUTPUT}"
          echo "✅ Compressed rollback package: ${ARTIFACT_NAME}.tar.gz"
          echo "✅ SHA256 checksum: ${CHECKSUM}"

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current_sha }}
          path: |
            rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.tar.gz
            rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.sha256
            rollback-artifacts/
          retention-days: 30

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          ARTIFACT_NAME: ${{ steps.compress.outputs.artifact_name }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
          SCRIPT_CREATED: ${{ steps.rollback-script.outputs.script_created }}
          BACKUP_CREATED: ${{ steps.backup-config.outputs.backup_created }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const checksum = process.env.CHECKSUM;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupCreated = process.env.BACKUP_CREATED;

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'A complete rollback package has been generated, verified, and uploaded as a workflow artifact.',
              '',
              '### 📋 Deployment Information',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: \`${packageVersion}\``,
              `- Artifact: \`${artifactName}\``,
              `- SHA256: \`${checksum}\``,
              '',
              '### ✅ Rollback Components',
              '- ✅ Executable rollback script with proper error handling',
              '- ✅ Configuration backups (package.json, package-lock.json, .env template)',
              '- ✅ Dependency verification script for compatibility checking',
              '- ✅ Detailed rollback documentation with step-by-step instructions',
              '- ✅ Compressed rollback package with SHA256 checksum',
              '- ✅ Artifact uploaded to GitHub Actions with 30-day retention',
              '',
              '### 🔍 Verification Status',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              '',
              '### ⚡ Quick Rollback Command',
              '',
              '```bash',
              `gh run download ${context.runId} --name ${artifactName}`,
              `tar -xzf ${artifactName}.tar.gz`,
              `sha256sum -c ${artifactName}.sha256`,
              'cd rollback-artifacts',
              './verify-deps.sh',
              './rollback.sh',
              '```',
              '',
              `Artifacts are retained for **30 days**. Checksum file: \`${artifactName}.sha256\`.`
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
            core.info(`Posted rollback plan comment on issue #${issueNumber}`);

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Update deployment labels
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
              core.info('Removed in-progress label');
            } catch (error) {
              if (error.status === 404) {
                core.info('Label in-progress was not present on the issue');
              } else {
                throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            core.info('Added completed label');

      - name: Post deployment completion comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          CURRENT_SHA: ${{ needs.pre-deployment.outputs.current_sha }}
          PREVIOUS_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const currentSha = process.env.CURRENT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const artifactName = `rollback-package-${currentSha}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## 🎉 Deployment Completed Successfully',
              '',
              `Deployment of commit \`${currentSha}\` has finished successfully.`,
              '',
              '### Pipeline Summary',
              '- ✅ Pre-deployment quality checks executed',
              '- ✅ Rollback artifacts prepared and uploaded',
              '- ✅ Deployment finalized',
              '',
              '### 📦 Rollback Artifact Details',
              `- **Artifact:** \`${artifactName}\``,
              '- **Retention:** 30 days',
              `- **Location:** [Workflow run #${context.runNumber}](${runUrl})`,
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Package Version:** \`${packageVersion}\``,
              '',
              'This tracking issue is now closed.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
            core.info(`Posted deployment completion comment on issue #${issueNumber}`);

      - name: Close deployment tracking issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            core.info(`Closed deployment tracking issue #${issueNumber}`);
